# CI/CD del backend (Hito 4)
#
#   Pruebas (4 módulos, en paralelo) ─┐
#                                     ├─> Imagen Docker (4, en paralelo) ─> CI backend verde ─> Deploy a Render (4)
#   Calcular versión ─────────────────┘                                                         └─> Smoke test (M1, M2)
#                                                                                                    └─> Versionado (tag + Release)
#
# - PR hacia main: pruebas, imágenes Docker y versión calculada (se comenta en el PR). No despliega ni crea versión.
# - Push/merge a main: todo lo anterior y, si pasa, despliega en Render, verifica producción y publica la versión.
# - Versionado semántico automático (Conventional Commits, ver .github/scripts/calcular-version.sh):
#   feat -> minor, fix/perf/refactor -> patch, "!" o BREAKING CHANGE -> major, docs/ci/chore -> sin versión.
#   La versión es el ÚLTIMO paso: si algo falla (pruebas, Docker, simular_error, deploy o smoke), no se crea.
# - Ejecución manual (Actions > CI Backend > Run workflow), con la casilla simular_error:
#   · desmarcada: igual que un push (desde main despliega y versiona).
#   · marcada: todo se prueba igual, pero la barrera "CI backend verde" falla a propósito; no hay deploy ni versión.
# Secrets: RENDER_HOOK_VENTAS y RENDER_HOOK_POSTVENTA (obligatorios); RENDER_HOOK_GATEWAY y RENDER_HOOK_PASARELA (opcionales).

name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular_error:
        description: "Genera un fallo controlado para la demostración académica."
        type: boolean
        default: false

# Dos ejecuciones seguidas de main esperan su turno (no se pisan al crear versiones)
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo: [servicio-ventas, servicio-postventa, api-gateway, simulador-pasarela]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar y ejecutar tests (mvn verify)
        run: mvn -B -pl ${{ matrix.modulo }} -am verify

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ matrix.modulo }}
          path: ${{ matrix.modulo }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  calcular-version:
    name: Calcular versión
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      anterior: ${{ steps.version.outputs.anterior }}
      siguiente: ${{ steps.version.outputs.siguiente }}
      tipo: ${{ steps.version.outputs.tipo }}
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calcular siguiente versión (SemVer)
        id: version
        run: bash .github/scripts/calcular-version.sh

      - name: Comentar la versión en el PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ANTERIOR: ${{ steps.version.outputs.anterior }}
          SIGUIENTE: ${{ steps.version.outputs.siguiente }}
          TIPO: ${{ steps.version.outputs.tipo }}
          PUBLICAR: ${{ steps.version.outputs.publicar }}
        run: |
          if [ "$PUBLICAR" = "true" ]; then
            cuerpo="**Versión del backend:** \`$ANTERIOR\` → \`$SIGUIENTE\` (cambio **$TIPO**). Se publicará al fusionar en \`main\` si el pipeline termina en verde."
          else
            cuerpo="**Versión del backend:** se mantiene en \`$ANTERIOR\` (solo hay cambios de docs/ci/chore/test)."
          fi
          gh pr comment "$PR" --edit-last --body "$cuerpo" 2>/dev/null || gh pr comment "$PR" --body "$cuerpo"

  imagen-docker:
    name: Imagen Docker (${{ matrix.modulo }})
    needs: pruebas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo: [servicio-ventas, servicio-postventa, api-gateway, simulador-pasarela]
    steps:
      - uses: actions/checkout@v5

      # Misma construcción que hace Render (Dockerfile Path = <módulo>/Dockerfile, contexto = raíz). No se publica.
      - name: Construir imagen
        run: docker build -f ${{ matrix.modulo }}/Dockerfile -t ${{ matrix.modulo }}:ci .

  ci-verde:
    name: CI backend verde
    needs: [pruebas, imagen-docker, calcular-version]
    # always(): este check SIEMPRE se reporta (rojo si algo falló). Un check "saltado" contaría como aprobado
    # en la protección de rama, por eso no se deja saltar.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que todos los jobs pasaron
        env:
          PRUEBAS: ${{ needs.pruebas.result }}
          DOCKER: ${{ needs.imagen-docker.result }}
          VERSION: ${{ needs.calcular-version.result }}
        run: |
          echo "Pruebas: $PRUEBAS | Imágenes Docker: $DOCKER | Versión: $VERSION"
          if [ "$PRUEBAS" != "success" ] || [ "$DOCKER" != "success" ] || [ "$VERSION" != "success" ]; then
            echo "::error title=CI en rojo::Al menos un job falló; no se despliega ni se crea versión."
            exit 1
          fi

      # Solo en ejecución manual con simular_error marcado; en push y PR inputs llega vacío y se salta
      - name: Fallo controlado (simular_error)
        if: ${{ inputs.simular_error == true }}
        run: |
          echo "::error title=Fallo simulado::Error forzado a propósito para la demostración; el código y las pruebas no se modificaron."
          exit 1

  deploy:
    name: Deploy a Render (${{ matrix.servicio }})
    needs: ci-verde
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: servicio-ventas
            hook: RENDER_HOOK_VENTAS
            obligatorio: true
          - servicio: servicio-postventa
            hook: RENDER_HOOK_POSTVENTA
            obligatorio: true
          - servicio: api-gateway
            hook: RENDER_HOOK_GATEWAY
            obligatorio: false
          - servicio: simulador-pasarela
            hook: RENDER_HOOK_PASARELA
            obligatorio: false
    steps:
      - name: Solicitar deploy
        env:
          HOOK: ${{ secrets[matrix.hook] }}
          SERVICIO: ${{ matrix.servicio }}
          SECRET: ${{ matrix.hook }}
          OBLIGATORIO: ${{ matrix.obligatorio }}
        run: |
          if [ -z "$HOOK" ]; then
            if [ "$OBLIGATORIO" = "true" ]; then echo "::error::Falta el secret $SECRET"; exit 1; fi
            echo "::notice::Sin $SECRET: se omite $SERVICIO"; exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy de $SERVICIO solicitado"

  smoke:
    name: Smoke test (${{ matrix.servicio }})
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: servicio-ventas
            url: https://g5-servicio-ventas.onrender.com
            protegida: /api/v1/pedidos
          - servicio: servicio-postventa
            url: https://g5-ventas-postventas-backend.onrender.com
            protegida: /api/v2/devoluciones
    steps:
      # Render (plan gratuito) puede tardar en despertar: se reintenta hasta ~10 minutos.
      - name: Health check (/actuator/health = UP)
        env:
          URL: ${{ matrix.url }}
        run: |
          for intento in $(seq 1 40); do
            if curl -fsS --max-time 20 "$URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "$URL responde UP (intento $intento)"; exit 0
            fi
            echo "Intento $intento: aún no responde, reintentando en 15 s..."; sleep 15
          done
          echo "::error::$URL no respondió UP"; exit 1

      - name: Seguridad activa (ruta protegida sin token = 401)
        env:
          URL: ${{ matrix.url }}
          RUTA: ${{ matrix.protegida }}
        run: |
          codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL$RUTA")"
          echo "GET $RUTA sin token -> $codigo"
          [ "$codigo" = "401" ] || { echo "::error::Se esperaba 401 y se obtuvo $codigo"; exit 1; }

  versionado:
    name: Versionado (tag + Release)
    needs: [calcular-version, smoke]
    if: needs.calcular-version.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Crear tag y GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.calcular-version.outputs.siguiente }}
          TIPO: ${{ needs.calcular-version.outputs.tipo }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Backend $VERSION" --generate-notes
          echo "### Versión publicada: \`$VERSION\` ($TIPO)" >> "$GITHUB_STEP_SUMMARY"
