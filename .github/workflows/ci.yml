# CI/CD del backend (Hito 4): Build → Compile → Test → Deploy
# - Corre en cada PR hacia main y en cada push a main.
# - Compila los 4 módulos y ejecuta todos los tests con Maven.
# - En un push a main, si los tests pasan, despliega servicio-ventas y servicio-postventa en Render
#   llamando a sus Deploy Hooks (Render > servicio > Settings > Deploy Hook). No necesita que la app
#   de Render esté instalada en la organización.
# Requiere los secrets RENDER_HOOK_VENTAS y RENDER_HOOK_POSTVENTA (Settings > Secrets and variables > Actions).
# RENDER_HOOK_GATEWAY y RENDER_HOOK_PASARELA son opcionales: sin ellos se omite ese servicio.
# - Ejecución manual (Actions > CI Backend > Run workflow), con la casilla simular_error:
#   · desmarcada: compila, prueba y, desde main, despliega igual que un push.
#   · marcada: compila y prueba igual (el código no se toca), luego un paso hace exit 1 a propósito;
#     el build queda en rojo y el deploy NO se ejecuta (depende de needs: build). Sirve para demostrar
#     que un fallo nunca llega a producción.

name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular_error:
        description: "Genera un fallo controlado para la demostración académica."
        type: boolean
        default: false

jobs:
  build:
    name: Build, Compile y Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar y ejecutar tests (mvn verify)
        run: mvn -B verify

      # Solo en ejecución manual con simular_error marcado; en push y PR inputs llega vacío y se salta
      - name: Fallo controlado (simular_error)
        if: ${{ inputs.simular_error == true }}
        run: |
          echo "::error title=Fallo simulado::Error forzado a propósito para la demostración; el código y las pruebas no se modificaron."
          exit 1

  deploy:
    name: Deploy a Render
    needs: build
    # needs: build es la barrera: si el build falla (también el fallo simulado), no se despliega
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar servicio-ventas (M1)
        env:
          HOOK: ${{ secrets.RENDER_HOOK_VENTAS }}
        run: |
          if [ -z "$HOOK" ]; then echo "Falta el secret RENDER_HOOK_VENTAS"; exit 1; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy de servicio-ventas solicitado"

      - name: Desplegar servicio-postventa (M2)
        env:
          HOOK: ${{ secrets.RENDER_HOOK_POSTVENTA }}
        run: |
          if [ -z "$HOOK" ]; then echo "Falta el secret RENDER_HOOK_POSTVENTA"; exit 1; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy de servicio-postventa solicitado"

      # api-gateway y simulador-pasarela: opcionales mientras no tengan su secret (se omiten con un aviso)
      - name: Desplegar api-gateway
        env:
          HOOK: ${{ secrets.RENDER_HOOK_GATEWAY }}
        run: |
          if [ -z "$HOOK" ]; then echo "::notice::Sin RENDER_HOOK_GATEWAY: se omite api-gateway"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy de api-gateway solicitado"

      - name: Desplegar simulador-pasarela
        env:
          HOOK: ${{ secrets.RENDER_HOOK_PASARELA }}
        run: |
          if [ -z "$HOOK" ]; then echo "::notice::Sin RENDER_HOOK_PASARELA: se omite simulador-pasarela"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy de simulador-pasarela solicitado"
