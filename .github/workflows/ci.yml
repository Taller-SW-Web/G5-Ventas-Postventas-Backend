# CI del backend (Hito 4): Build → Compile → Test
# - Corre en cada PR hacia main y en cada push a main.
# - Compila los 4 módulos y ejecuta todos los tests con Maven.
# - El Deploy lo hace Render: con Auto-Deploy en "After CI Checks Pass",
#   solo despliega servicio-ventas y servicio-postventa si este workflow pasa.

name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Compile y Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar y ejecutar tests (mvn verify)
        run: mvn -B verify
