server:
  port: ${PORT:8083}   # Render asigna PORT

spring:
  application:
    name: simulador-pasarela
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

pasarela:
  # A quién avisa el resultado del cobro (endpoint 1.2 de M1)
  ventas-url: ${VENTAS_URL:http://localhost:8081}
  # Token de servicio para avisar a M1 (scope ventas:pagos:webhook). Sin secreto el aviso sale sin token
  token-url: ${SECURITY_TOKEN_URL:http://localhost:8080/api/v1/auth/token}
  client-id: ${PASARELA_CLIENT_ID:simulador-pasarela}
  client-secret: ${PASARELA_CLIENT_SECRET:}
  # Espera antes de avisar a M1, para simular el procesamiento
  demora-ms: 2000
  # Reintentos si M1 no responde 200
  reintentos: 3

management:
  endpoints:
    web:
      exposure:
        include: health
