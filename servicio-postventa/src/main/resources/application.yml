server:
  port: 8082

spring:
  application:
    name: servicio-postventa
  config:
    # Lee el .env de la raíz (o del módulo) si existe
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # nunca update: las tablas las maneja el SQL compartido
    properties:
      hibernate:
        default_schema: postventa
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB          # evidencias de devolución (F3)
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Pendiente: migrar a la validación de M1 (ver CLAUDE.md, tarea M2-SEG)
          jwk-set-uri: ${SECURITY_JWKS_URL:http://localhost:8080/api/v1/auth/.well-known/jwks.json}

seguridad:
  habilitada: ${SEGURIDAD_HABILITADA:true}

integracion:
  simulado: ${INTEGRACION_SIMULADA:true}
  ventas-url: ${VENTAS_URL:http://localhost:8081}
  pasarela-url: ${PASARELA_URL:http://localhost:8083}
  pasarela-simulada: ${PASARELA_SIMULADA:true}

management:
  endpoints:
    web:
      exposure:
        include: health
