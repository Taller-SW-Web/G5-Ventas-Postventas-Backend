server:
  port: ${PORT:8082}   # Render asigna PORT

spring:
  application:
    name: servicio-postventa
  config:
    # Lee el .env de la raíz (o del módulo) si existe
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:3}   # Supabase: máximo 15 conexiones para todo el equipo
      minimum-idle: 1                       # en reposo ocupa solo 1
      idle-timeout: 60000                   # suelta las que no usa al minuto
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # nunca update: las tablas las maneja el SQL compartido
    properties:
      hibernate:
        default_schema: postventa
  # RabbitMQ de eventos de pedido (CloudAMQP, acuerdos-mecanismo-asincrono.md). Solo se conecta con
  # EVENTOS_ASINCRONOS=true. La URL amqps:// lleva usuario, clave y vhost: va solo en Render y en el .env
  rabbitmq:
    addresses: ${EVENTOS_RABBITMQ_URL:amqp://guest:guest@localhost:5672}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB          # evidencias de devolución (F3)
      max-request-size: 6MB

# Validación del JWT igual que M1 (acuerdo A10). El decoder se arma en compartido/SecurityConfig.java;
# no usar spring.security.oauth2.* aquí.
seguridad:
  habilitada: ${SEGURIDAD_HABILITADA:true}
  issuer: ${SECURITY_ISSUER:http://localhost:8080/api/v1/auth}          # coincidencia exacta con iss
  jwks-url: ${SECURITY_JWKS_URL:http://localhost:8080/api/v1/auth/.well-known/jwks.json}
  audiencia: api-postventa                                               # solo tokens de servicio
  cors-origenes: ${CORS_ORIGINS:http://localhost:5173}                   # separados por coma
  cliente-prueba: ${CLIENTE_PRUEBA:11111111-1111-1111-1111-111111111111} # solo con habilitada=false (/devoluciones/me)
  # Token de servicio de M2 (client_credentials, kit de Seguridad §4 y §6). La credencial real llega en el Hito 4
  token-url: ${SECURITY_TOKEN_URL:http://localhost:8080/api/v1/auth/token}
  client-id: ${POSTVENTA_CLIENT_ID:modulo-postventa}
  client-secret: ${POSTVENTA_CLIENT_SECRET:secreto-de-prueba}               # clave de prueba del kit §6

integracion:
  simulado: ${INTEGRACION_SIMULADA:true}
  # false: M2 consulta los pedidos reales de M1 aunque Productos siga simulado. Si falta, usa INTEGRACION_SIMULADA
  ventas-simulado: ${VENTAS_SIMULADO:${integracion.simulado}}
  ventas-url: ${VENTAS_URL:http://localhost:8081}
  pasarela-url: ${PASARELA_URL:http://localhost:8083}
  pasarela-simulada: ${PASARELA_SIMULADA:true}
  pasarela-timeout-ms: ${PASARELA_TIMEOUT_MS:2000}
  productos-url: ${PRODUCTOS_URL:http://localhost:8090}
  # location_id del almacén de devoluciones para el reintegro (G6, P-04). Vacío hasta que G6 lo defina: 503 en modo real
  productos-ubicacion-devoluciones: ${PRODUCTOS_UBICACION_DEVOLUCIONES:}

# Evidencias de devolución (F3, 2.1). local: carpeta del disco y URL de prueba; supabase: Supabase Storage
evidencias:
  almacen: ${EVIDENCIAS_ALMACEN:local}
  carpeta-local: ${EVIDENCIAS_CARPETA:uploads/evidencias}
  url-local: ${EVIDENCIAS_URL_LOCAL:http://localhost:8082/uploads/evidencias}
  supabase-url: ${SUPABASE_URL:}
  supabase-clave: ${SUPABASE_SERVICE_KEY:}
  bucket: ${EVIDENCIAS_BUCKET:evidencias}

# Diseño de la API en Swagger UI (/swagger-ui.html). El contrato es el archivo escrito a mano, no uno generado
springdoc:
  swagger-ui:
    url: /openapi/postventa.yaml
    disable-swagger-default-url: true
    operations-sorter: method

# Eventos de pedido de M1. false: solo llegan por POST /api/v2/eventos (HTTP), como antes del Hito 5.
# true: además se consumen de la cola postventa.eventos-pedido.q. El endpoint HTTP sigue activo como respaldo
eventos:
  asincronos: ${EVENTOS_ASINCRONOS:false}

management:
  health:
    rabbit:
      enabled: false   # si CloudAMQP falla, el health no cae: los endpoints HTTP siguen funcionando
  endpoints:
    web:
      exposure:
        include: health
