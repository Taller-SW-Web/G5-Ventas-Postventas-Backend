server:
  port: ${PORT:8081}   # Render asigna PORT

spring:
  application:
    name: servicio-ventas
  config:
    # Lee el .env de la raíz (o del módulo) si existe
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # nunca update: las tablas las maneja el SQL compartido
    properties:
      hibernate:
        default_schema: ventas
  # RabbitMQ de Productos (G6, rabbitmq-topologia.md). Solo se conecta con INTEGRACION_SIMULADA=false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/marketplace}
    listener:
      simple:
        prefetch: 20
        default-requeue-rejected: false   # agotados los reintentos, va a la DLQ de Productos (nunca en bucle)
        retry:
          enabled: true
          max-attempts: 4                 # el pedido puede no haber terminado de guardarse
          initial-interval: 2s
          multiplier: 2
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# Validación del JWT según el kit de integración de Seguridad (G7) y el acuerdo A10.
# El decoder se arma en compartido/SecurityConfig.java; no usar spring.security.oauth2.* aquí.
seguridad:
  habilitada: ${SEGURIDAD_HABILITADA:true}
  issuer: ${SECURITY_ISSUER:http://localhost:8080/api/v1/auth}          # coincidencia exacta con iss
  jwks-url: ${SECURITY_JWKS_URL:http://localhost:8080/api/v1/auth/.well-known/jwks.json}
  audiencia: api-ventas                                                  # solo tokens de servicio
  cors-origenes: ${CORS_ORIGINS:http://localhost:5173}                   # separados por coma
  cliente-prueba: ${CLIENTE_PRUEBA:11111111-1111-1111-1111-111111111111} # solo con habilitada=false
  # Token de servicio de modulo-ventas para llamar a M2, Productos y Despacho (client_credentials).
  # Sin client-secret las llamadas salen sin token. El secreto va solo en el .env
  token-url: ${SECURITY_TOKEN_URL:http://localhost:8080/api/v1/auth/token}
  client-id: ${SECURITY_CLIENT_ID:modulo-ventas}
  client-secret: ${SECURITY_CLIENT_SECRET:}

integracion:
  simulado: ${INTEGRACION_SIMULADA:true}
  productos-url: ${PRODUCTOS_URL:http://localhost:8090}     # Módulo F (G6), reserva de stock
  pasarela-url: ${PASARELA_URL:http://localhost:8083}      # simulador-pasarela (cobro de MARKETPLACE)
  postventa-url: ${POSTVENTA_URL:http://localhost:8082}     # M2: reembolsos (2.6) y eventos (2.13)
  postventa-simulado: ${POSTVENTA_SIMULADO:${INTEGRACION_SIMULADA:true}}   # false: llama a M2 aunque Productos siga simulado
  pasarela-simulada: ${PASARELA_SIMULADA:true}             # true: solo log; false: llama al simulador
  productos-cola: po.sales.q
  eventos:
    intervalo-ms: 5000          # envío del outbox a M2 (guía 5.8)
  reembolsos:
    intervalo-ms: 60000         # reintento de reembolsos pendientes (solicitud_reembolso)

management:
  health:
    rabbit:
      enabled: false   # el broker es de Productos: no tumba el health de M1
  endpoints:
    web:
      exposure:
        include: health
