server:
  port: ${PORT:8081}   # Render asigna PORT

spring:
  application:
    name: servicio-ventas
  config:
    # Lee el .env de la raíz (o del módulo) si existe
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # nunca update: las tablas las maneja el SQL compartido
    properties:
      hibernate:
        default_schema: ventas
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# Validación del JWT según el kit de integración de Seguridad (G7) y el acuerdo A10.
# El decoder se arma en compartido/SecurityConfig.java; no usar spring.security.oauth2.* aquí.
seguridad:
  habilitada: ${SEGURIDAD_HABILITADA:true}
  issuer: ${SECURITY_ISSUER:http://localhost:8080/api/v1/auth}          # coincidencia exacta con iss
  jwks-url: ${SECURITY_JWKS_URL:http://localhost:8080/api/v1/auth/.well-known/jwks.json}
  audiencia: api-ventas                                                  # solo tokens de servicio
  cors-origenes: ${CORS_ORIGINS:http://localhost:5173}                   # separados por coma
  cliente-prueba: ${CLIENTE_PRUEBA:11111111-1111-1111-1111-111111111111} # solo con habilitada=false

integracion:
  simulado: ${INTEGRACION_SIMULADA:true}
  productos-url: ${PRODUCTOS_URL:http://localhost:8090}     # Módulo F (G6), reserva de stock
  pasarela-url: ${PASARELA_URL:http://localhost:8083}      # simulador-pasarela (cobro de MARKETPLACE)
  pasarela-simulada: ${PASARELA_SIMULADA:true}             # true: solo log; false: llama al simulador
  eventos:
    intervalo-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
