server:
  port: ${PORT:8080}   # Render asigna PORT

spring:
  application:
    name: api-gateway
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_FIRST
          routes:
            # M1: F1 Pedidos y F2 Anulaciones; webhook de Despacho (acuerdo G2, D6)
            - id: servicio-ventas
              uri: ${VENTAS_URL:http://localhost:8081}
              predicates:
                - Path=/api/*/pedidos/**,/api/*/integraciones/despachos/**
            # M2: F3 a F6. POST /api/v2/eventos no pasa por aquí (M1 llama directo a M2)
            - id: servicio-postventa
              uri: ${POSTVENTA_URL:http://localhost:8082}
              predicates:
                - Path=/api/*/devoluciones/**,/api/*/reembolsos/**,/api/*/csat/**,/api/*/reclamos/**,/api/*/dashboard/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # Mismo emisor y JWKS que los servicios (kit de Seguridad G7)
          issuer-uri: ${SECURITY_ISSUER:http://localhost:8080/api/v1/auth}
          jwk-set-uri: ${SECURITY_JWKS_URL:http://localhost:8080/api/v1/auth/.well-known/jwks.json}
          jws-algorithms: RS256

seguridad:
  habilitada: ${SEGURIDAD_HABILITADA:true}

management:
  endpoints:
    web:
      exposure:
        include: health
